apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-config
data:
  APP_NAME: "Voyages Scolaires"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://localhost"

  LOG_CHANNEL: "stderr"

  DB_CONNECTION: "mysql"
  DB_HOST: "mariadb"
  DB_PORT: "3306"
  DB_DATABASE: "voyages_scolaires"

  SESSION_DRIVER: "database"
  CACHE_STORE: "database"