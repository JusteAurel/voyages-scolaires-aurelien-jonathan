# Relance du pipeline propre
name: CI/CD
on:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, sqlite3, mbstring, gd, zip
          
      - run: composer install --no-interaction --no-progress
      
      # Configuration de Node.js et compilation des assets (Vite / Tailwind)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && npm run build
      
      - run: cp .env.example .env && php artisan key:generate
      
      # Exécution des tests avec la base SQLite en mémoire
      - run: php artisan test
        env:
          DB_CONNECTION: "sqlite"
          DB_DATABASE: ":memory:"

  build-push:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: docker/setup-qemu-action@v3
      
      - uses: docker/setup-buildx-action@v3
      
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          push: true
          platforms: linux/amd64, linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}